packages:
  - "apps/*"
  - "packages/*"

disallowWorkspaceCycles: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "nanoid@3.3.17"
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
  - "chokidar@4.0.3"
  - style-to-object
allowBuilds:
  "@sentry/cli": false
  better-sqlite3: true
  core-js: false
  esbuild: true
  simple-git-hooks: false
  spawn-sync: false
  unrs-resolver: true
overrides:
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "adm-zip@<0.6.0": "0.6.0"
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "ajv>fast-uri": "3.1.5"
  "feedsmith>fast-xml-parser": "5.10.1"
  "js-yaml@>=3.0.0 <3.15.1": "3.15.1"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "postcss>nanoid": "3.3.17"
  rolldown: "~1.1.4"
  "shell-quote@<=1.8.4": "1.9.0"
  "socket.io>socket.io-parser": "4.2.7"
  "undici@>=7.0.0 <7.29.0": "7.29.0"
  "web-ext-run>tmp": "0.2.7"
  "wxt>@webext-core/isolated-element": "1.1.4"
  "workbox-build>rollup": "~2.79.2"
